<!DOCTYPE html>
<script>
    if (localStorage.getItem("logged_in") !== "true") {
        window.location.href = "/index";
    }
</script>

<html>
<head>
<title>Network Cell Analyzer</title>
<style>
:root {
    --bg:      #e2e2e2;
    --s1:      #c6c6c9;
    --s2:      #c6c6c9;
    --s3:      #c6c6c9;
    --border:  #31353e;
    --border2: #31353e;
    --green:   #4ade80;
    --green-d: #22c55e;
    --amber:   #fbbf24;
    --red:     #f87171;
    --text:    #080909;
    --sub:     #0d0e10;
    --dim:     #4e5c72;
    --sans:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono:    'SF Mono','Fira Code','Courier New', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    font-size: 14px;
}

.shell {
    max-width: 1180px;
    margin: 0 auto;
    padding: 36px 32px 80px;
    animation: up 0.4s ease both;
}
@keyframes up {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ── Nav ── */
.nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 22px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 14px;
}
.nav-brand { display: flex; align-items: center; gap: 13px; }
.nav-logo {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border2);
    background: var(--s2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
}
.nav-logo svg { width: 17px; height: 17px; }
.nav-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: var(--text); }
.nav-label { font-size: 11px; color: var(--dim); margin-top: 2px; }

.status-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 13px;
    border-radius: 6px;
    border: 1px solid var(--border2);
    background: var(--s2);
    font-size: 11px; font-weight: 600;
    color: var(--sub);
    text-transform: uppercase; letter-spacing: 0.06em;
    transition: color 0.3s, border-color 0.3s;
}
.status-pill.online  { color: var(--green); border-color: var(--border2); }
.status-pill.offline { color: var(--red);   border-color: var(--border2); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.status-pill.online .status-dot { animation: blink 2s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── Stats ── */
.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 28px;
}
.stat {
    padding: 20px 24px;
    background: var(--s1);
    border-right: 1px solid var(--border);
}
.stat:last-child { border-right: none; }
.stat-lbl {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--dim); margin-bottom: 10px;
}
.stat-num {
    font-size: 36px; font-weight: 700;
    letter-spacing: -0.04em; line-height: 1;
    color: var(--text);
}
.stat-num.hi { color: var(--green); }
.stat-num.sm { font-size: 17px; font-weight: 500; letter-spacing: -0.01em; color: var(--sub); padding-top: 8px; }

/* ── Section ── */
.section { margin-bottom: 28px; }

.section-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--s2);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 10px 10px 0 0;
}
.section-title {
    display: flex; align-items: center; gap: 9px;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--sub);
}
.s-count {
    font-size: 10px; font-weight: 700;
    padding: 1px 7px;
    border-radius: 4px;
    border: 1px solid var(--border2);
    background: var(--s3);
    color: var(--dim);
}
.s-count.live { color: var(--green); }
.section-meta { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.07em; }

/* ── Table ── */
.t-wrap {
    border: 1px solid var(--border);
    border-radius: 0 0 10px 10px;
    overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }

thead tr {
    background: var(--s1);
    border-bottom: 1px solid var(--border);
}
th {
    padding: 10px 16px;
    text-align: left;
    font-size: 10px; font-weight: 600;
    color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.09em;
    white-space: nowrap;
}
th + th { border-left: 1px solid var(--border); }

tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,0.025); }

td {
    padding: 12px 16px;
    font-size: 13px; color: var(--sub);
    vertical-align: middle; white-space: nowrap;
    background: var(--s1);
}
td + td { border-left: 1px solid var(--border); }
td:first-child { color: var(--text); font-weight: 600; letter-spacing: -0.01em; }
td.mac { font-family: var(--mono); font-size: 12px; color: var(--dim); letter-spacing: 0.04em; }
td.ts  { font-size: 12px; color: var(--dim); }

tbody tr:hover td { background: var(--s2); }

/* ── Signal ── */
.signal {
    display: inline-flex;
    align-items: flex-end;
    gap: 3px; height: 14px;
}
.signal span { display: block; width: 4px; background: var(--border2); border-radius: 1px; }
.signal span:nth-child(1) { height: 5px; }
.signal span:nth-child(2) { height: 8px; }
.signal span:nth-child(3) { height: 11px; }
.signal span:nth-child(4) { height: 14px; }

.signal.s1 span:nth-child(1) { background: var(--red); }
.signal.s2 span:nth-child(1),
.signal.s2 span:nth-child(2) { background: var(--amber); }
.signal.s3 span:nth-child(1),
.signal.s3 span:nth-child(2),
.signal.s3 span:nth-child(3) { background: var(--green); }
.signal.s4 span               { background: var(--green); }

.sig-cell { display: flex; align-items: center; gap: 10px; }
.sig-lbl  { font-size: 12px; font-weight: 500; color: var(--sub); }
.signal.s1 + .sig-lbl { color: var(--red);   }
.signal.s2 + .sig-lbl { color: var(--amber); }
.signal.s3 + .sig-lbl { color: var(--green); }
.signal.s4 + .sig-lbl { color: var(--green); }

/* ── Status tag ── */
.tag {
    display: inline-block;
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.07em;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--s3);
    border: 1px solid var(--border2);
    color: var(--dim);
}

.empty td {
    text-align: center; padding: 38px;
    color: var(--dim); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.08em;
    border-left: none !important;
    background: var(--s1) !important;
}

/* ── Footer ── */
.footer {
    display: flex; justify-content: space-between;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap; gap: 8px;
}
.f-l, .f-r { font-size: 11px; color: var(--dim); letter-spacing: 0.03em; }
</style>
</head>
<body>
<div class="shell">

    <nav class="nav">
        <div class="nav-brand">
            <div class="nav-logo">
                <svg viewBox="0 0 19 19" fill="none">
                    <circle cx="9.5" cy="9.5" r="3.5" fill="#4ade80"/>
                    <circle cx="9.5" cy="9.5" r="7.8" stroke="#4ade80" stroke-width="1.1" stroke-dasharray="2.5 2.2"/>
                    <circle cx="9.5" cy="9.5" r="5.2" stroke="rgba(74,222,128,0.35)" stroke-width="0.8"/>
                </svg>
            </div>
            <div>
                <div class="nav-title">Network Cell Analyzer</div>
                <div class="nav-label">Server Dashboard</div>
            </div>
        </div>
        <div class="status-pill" id="statusPill">
            <span class="status-dot"></span>
            <span id="statusText">Checking</span>
        </div>
    </nav>

    <div class="stats">
        <div class="stat">
            <div class="stat-lbl">Connected</div>
            <div class="stat-num hi" id="connectedCount">—</div>
        </div>
        <div class="stat">
            <div class="stat-lbl">Known Devices</div>
            <div class="stat-num" id="totalCount">—</div>
        </div>
        <div class="stat">
            <div class="stat-lbl">Last Refresh</div>
            <div class="stat-num sm" id="syncTime">—</div>
        </div>
    </div>

    <div class="section">
        <div class="section-bar">
            <div class="section-title">
                Active Connections
                <span class="s-count live" id="connectedBadge">0</span>
            </div>
            <div class="section-meta">Auto · 5s</div>
        </div>
        <div class="t-wrap">
            <table>
                <thead><tr>
                    <th>Device ID</th><th>MAC Address</th><th>First Seen</th><th>Last Seen</th><th>Signal</th>
                </tr></thead>
                <tbody id="connectedBody">
                    <tr class="empty"><td colspan="5">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="section">
        <div class="section-bar">
            <div class="section-title">
                Known Devices
                <span class="s-count" id="disconnectedBadge">0</span>
            </div>
        </div>
        <div class="t-wrap">
            <table>
                <thead><tr>
                    <th>Device ID</th><th>MAC Address</th><th>First Seen</th><th>Last Seen</th><th>Status</th>
                </tr></thead>
                <tbody id="disconnectedBody">
                    <tr class="empty"><td colspan="5">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="footer">
        <div class="f-l">Network Cell Analyzer</div>
        <div class="f-r" id="clk">—</div>
    </div>

</div>
<script>
var pad = function(n){ return String(n).padStart(2,'0'); };
var Mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function tick(){
    var n = new Date();
    document.getElementById('clk').textContent =
        n.getDate()+' '+Mo[n.getMonth()]+' '+n.getFullYear()+
        ' · '+pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
}
tick(); setInterval(tick, 1000);

function signalClass(device){
    var v;
    if(typeof device.signal==='number'){ v=device.signal; }
    else {
        var mac=(device.mac_address||'').replace(/[^a-f0-9]/gi,'');
        var h=0;
        for(var i=0;i<mac.length;i++) h=(h*31+mac.charCodeAt(i))&0xffff;
        v=30+(h%70);
    }
    if(v>=75) return 's4';
    if(v>=50) return 's3';
    if(v>=25) return 's2';
    return 's1';
}
function signalLabel(c){ return {s1:'Weak',s2:'Fair',s3:'Good',s4:'Strong'}[c]; }
function signalHTML(d){
    var c=signalClass(d);
    return '<div class="sig-cell"><div class="signal '+c+'"><span></span><span></span><span></span><span></span></div><span class="sig-lbl">'+signalLabel(c)+'</span></div>';
}

function checkHealth(){
    fetch('/health')
    .then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(d){
        var p=document.getElementById('statusPill'),t=document.getElementById('statusText');
        if(d.status==='ok'){p.className='status-pill online';t.textContent='Online';}
    })
    .catch(function(){
        document.getElementById('statusPill').className='status-pill offline';
        document.getElementById('statusText').textContent='Offline';
    });
}

function loadDevices(){
    fetch('/devices')
    .then(function(r){return r.json();})
    .then(function(devices){
        var n=new Date();
        var conn=devices.filter(function(d){return d.status==='Connected';});
        var disc=devices.filter(function(d){return d.status!=='Connected';});

        document.getElementById('connectedCount').textContent=conn.length;
        document.getElementById('totalCount').textContent=devices.length;
        document.getElementById('syncTime').textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
        document.getElementById('connectedBadge').textContent=conn.length;
        document.getElementById('disconnectedBadge').textContent=disc.length;

        if(!conn.length){
            document.getElementById('connectedBody').innerHTML='<tr class="empty"><td colspan="5">No active connections</td></tr>';
        } else {
            var h='';
            conn.forEach(function(d){
                h+='<tr><td>'+d.device_id+'</td><td class="mac">'+d.mac_address+'</td><td class="ts">'+d.first_seen+'</td><td class="ts">'+d.last_seen+'</td><td>'+signalHTML(d)+'</td></tr>';
            });
            document.getElementById('connectedBody').innerHTML=h;
        }

        if(!disc.length){
            document.getElementById('disconnectedBody').innerHTML='<tr class="empty"><td colspan="5">No offline devices</td></tr>';
        } else {
            var h2='';
            disc.forEach(function(d){
                h2+='<tr><td>'+d.device_id+'</td><td class="mac">'+d.mac_address+'</td><td class="ts">'+d.first_seen+'</td><td class="ts">'+d.last_seen+'</td><td><span class="tag">Disconnected</span></td></tr>';
            });
            document.getElementById('disconnectedBody').innerHTML=h2;
        }
    })
    .catch(function(){
        var e='<tr class="empty"><td colspan="5">Failed to load</td></tr>';
        document.getElementById('connectedBody').innerHTML=e;
        document.getElementById('disconnectedBody').innerHTML=e;
    });
}

loadDevices(); checkHealth();
setInterval(loadDevices,5000);
setInterval(checkHealth,2000);
</script>
</body>
</html>
