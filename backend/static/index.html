<!DOCTYPE html>
<html>
<head>
<title>Network Cell Analyzer · Login</title>
<style>
:root {
    --bg:      #161a22;
    --s1:      #1e2330;
    --s2:      #242a38;
    --s3:      #2a3040;
    --border:  #2e3548;
    --border2: #3a4258;
    --green:   #4ade80;
    --red:     #f87171;
    --text:    #e8ecf2;
    --sub:     #8a96aa;
    --dim:     #4e5c72;
    --sans:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
    overflow: hidden;
}

/* ─────────────────────────────────────────
   BACKGROUND (UPDATED)
───────────────────────────────────────── */
.bg {
    position: fixed;
    inset: 0;
    z-index: 0;

    background-image: url('/static/cells2%20(1).jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* Overlay */
.bg-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: rgba(8, 11, 16, 0.55);
}

/* ── Page layout ── */
.page {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    padding: 52px 56px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

/* ── Center card ── */
.card-wrap {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 340px;
    animation: up 0.45s ease both;
}
@keyframes up {
    from { opacity: 0; transform: translate(-50%, calc(-50% + 10px)); }
    to   { opacity: 1; transform: translate(-50%, -50%); }
}

.card {
    background: var(--s1);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    backdrop-filter: blur(6px);
}

.card-head {
    display: flex; align-items: center; gap: 11px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--s2);
}
.card-logo {
    width: 30px; height: 30px;
    border-radius: 7px;
    border: 1px solid var(--border2);
    background: var(--s3);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
}
.card-logo svg { width: 15px; height: 15px; }
.card-name { font-size: 12px; font-weight: 600; color: var(--text); }
.card-sub  { font-size: 11px; color: var(--dim); margin-top: 1px; }

.card-body { padding: 22px 20px 20px; }

.field { margin-bottom: 12px; }
.field label {
    display: block;
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--dim); margin-bottom: 6px;
}
.field input {
    width: 100%;
    background: var(--s2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.15s;
}
.field input::placeholder { color: var(--dim); }
.field input:focus { border-color: var(--border2); }

.btn {
    width: 100%;
    margin-top: 8px;
    padding: 11px;
    background: var(--s3);
    border: 1px solid var(--border2);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
}
.btn:hover  { background: var(--border); border-color: var(--sub); }
.btn:active { opacity: 0.75; }

.error {
    margin-top: 12px;
    min-height: 16px;
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: transparent; transition: color 0.2s;
    text-align: center;
}
.error.show { color: var(--red); }

</style>
</head>
<body>

<div class="bg"></div>
<div class="bg-overlay"></div>

<div class="page">

    <!-- Centered login card -->
    <div class="card-wrap">
        <div class="card">
            <div class="card-head">
                <div class="card-logo">
                    <svg viewBox="0 0 19 19" fill="none">
                        <circle cx="9.5" cy="9.5" r="3.5" fill="#4ade80"/>
                        <circle cx="9.5" cy="9.5" r="7.8" stroke="#4ade80" stroke-width="1.1" stroke-dasharray="2.5 2.2"/>
                        <circle cx="9.5" cy="9.5" r="5.2" stroke="rgba(74,222,128,0.35)" stroke-width="0.8"/>
                    </svg>
                </div>
                <div>
                    <div class="card-name">Server Dashboard</div>
                    <div class="card-sub">Sign in to continue</div>
                </div>
            </div>

            <div class="card-body">
                <div class="field">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter username">
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password">
                </div>
                <button class="btn" onclick="login()">Sign in</button>
                <div class="error" id="errorText"></div>
            </div>
        </div>
    </div>

</div>

<script>
const SERVER_BASE_URL = "https://eece-451-project.onrender.com ";

document.addEventListener('keydown', function(e){
    if(e.key==='Enter') login();
});

async function login(){
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    var err = document.getElementById('errorText');

    err.textContent='';
    err.className='error';

    function setError(msg){
        err.textContent=msg;
        err.className='error show';
    }

    try {
        var response = await ffetch('/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: username, password: password })
})
.then(function(r) { return r.json(); })
.then(function(data) {
    if (data.response === 'ok') {
        window.location.href = '/dashboard';  // cookie already set by server
    } else if (data.response === 'user') {
        // show "invalid username" error
    } else if (data.response === 'pass') {
        // show "wrong password" error
    }
});
}
</script>

</body>
</html>
